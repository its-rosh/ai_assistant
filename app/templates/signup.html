<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - My AI Assistant</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

    <div class="chat-container">

        <header class="header">

            <h1>My AI Assistant</h1>

            <p>Create your account</p>

        </header>


        <main>

            <form id="signupForm">

                <div class="input-area">

                    <input
                        id="email"
                        type="email"
                        placeholder="Email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="input-area">

                    <input
                        id="password"
                        type="password"
                        placeholder="Password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="input-area">

                    <input
                        id="confirmPassword"
                        type="password"
                        placeholder="Confirm password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="input-area">

                    <button type="submit">
                        Create Account
                    </button>

                </div>

            </form>


            <p id="message"></p>


            <p>
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </main>

    </div>


    <script>

        const signupForm =
            document.getElementById("signupForm");

        const message =
            document.getElementById("message");


        signupForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                if (password !== confirmPassword) {

                    message.textContent =
                        "Passwords do not match.";

                    return;
                }


                message.textContent =
                    "Creating account...";


                try {

                    const response =
                        await fetch(
                            "/api/signup",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        message.textContent =
                            data.error ||
                            "Could not create account.";

                        return;
                    }


                    message.textContent =
                        "Account created!";


                    window.location.href = "/";


                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Something went wrong.";

                }

            }
        );

    </script>

</body>

</html>
