<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - My AI Assistant</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

    <div class="chat-container">

        <header class="header">

            <h1>My AI Assistant</h1>

            <p>Login to continue</p>

        </header>


        <main>

            <form id="loginForm">

                <div class="input-area">

                    <input
                        id="email"
                        type="email"
                        placeholder="Email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="input-area">

                    <input
                        id="password"
                        type="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div class="input-area">

                    <button type="submit">
                        Login
                    </button>

                </div>

            </form>


            <p id="message"></p>


            <p>
                Don't have an account?
                <a href="/signup">Create an account</a>
            </p>

        </main>

    </div>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                message.textContent =
                    "Logging in...";


                try {

                    const response =
                        await fetch(
                            "/api/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        message.textContent =
                            data.error ||
                            "Login failed.";

                        return;
                    }


                    message.textContent =
                        "Login successful!";


                    window.location.href = "/";


                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Something went wrong.";

                }

            }
        );

    </script>

</body>

</html>
